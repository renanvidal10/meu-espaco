# Publica a pasta cantinho-kids no GitHub Pages sempre que algo nela muda.
# O endereço fica: https://renanvidal10.github.io/meu-espaco/
name: Publicar Cantinho Kids

on:
  push:
    branches: [main]
    paths: ["cantinho-kids/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cantinho-kids
      - id: deploy
        uses: actions/deploy-pages@v4
