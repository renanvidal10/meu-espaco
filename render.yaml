# Blueprint do Render.
#
# Criando o serviço como Blueprint, o Render lê este arquivo e já preenche
# branch, diretório, comandos e a lista de variáveis — em vez de depender de
# alguém lembrar o que configurou no painel meses atrás.
#
# As variáveis marcadas com `sync: false` NÃO ficam no repositório: o Render
# pergunta o valor de cada uma na criação do serviço. Chave de API nunca entra
# em arquivo versionado.

services:
  - type: web
    name: oncogenyx
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Login com senha e CRM conferido (docs/ARQUITETURA.md §85). Em
      # produção o servidor recusa subir sem DATABASE_URL, RESEND_API_KEY,
      # APP_ORIGIN e CHAVE_CIFRA.
      - key: AUTH_MODE
        value: completo

      # E-mails de quem confere os CRMs novos, separados por vírgula.
      - key: ADMIN_EMAILS
        sync: false

      # Cifra dos tokens do Plaud no banco. Gerada uma vez e mantida.
      - key: CHAVE_CIFRA
        generateValue: true

      # Endereço público do site, usado nos links dos e-mails.
      - key: APP_ORIGIN
        sync: false

      # Envio dos e-mails de confirmação e de nova senha.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Leitura automática do laudo. Sem ela o app sobe, mas a extração falha.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Assinatura das sessões.
      - key: SESSION_SECRET
        generateValue: true

      # O disco do plano gratuito é efêmero: zera a cada publicação e a cada
      # hibernação (15 min sem uso). Sem banco, a sessão de todos os médicos
      # some sozinha — por isso o app se recusa a subir em produção sem esta
      # variável. Ver docs/ARQUITETURA.md.
      - key: DATABASE_URL
        sync: false
