<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="2400" viewBox="0 0 1024 2400" font-family="Inter, 'DejaVu Sans', sans-serif">
<rect width="1024" height="2400" fill="#ffffff"/>
<text x="32" y="40" font-size="21" font-weight="600" fill="#1a1a1a" text-anchor="start" >Da chegada ao Café ou à célula: quem faz cada passo e onde falta um responsável</text>
<rect x="32" y="70" width="20" height="20" rx="5" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="62" y="86" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="start" >O sistema faz sozinho</text>
<rect x="402" y="70" width="20" height="20" rx="5" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="432" y="86" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="start" >Feito por pessoas</text>
<text x="32" y="152" font-size="14.5" font-weight="400" fill="#666" text-anchor="start" >Não existe botão “sem interesse”: quem preencheu o formulário já é, no mínimo, um contato morno.</text>
<rect x="212" y="175" width="600" height="300" rx="16" fill="#efeeec"/>
<text x="512" y="202" font-size="15" font-weight="500" fill="#666" text-anchor="middle" >VISITANTE</text>
<rect x="242" y="218" width="540" height="88" rx="12" fill="#d3e5d2" stroke="#2ca02c" stroke-width="2"/>
<text x="512.0" y="246.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Chegada no culto</text>
<text x="512.0" y="268.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >a pessoa preenche o formulário de visitante</text>
<text x="512.0" y="289.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >e ele entra sozinho no sistema</text>
<path d="M512,306 L512,336" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,328 L512,336 L517,328 Z" fill="#bdbdb9"/>
<rect x="242" y="336" width="540" height="108" rx="12" fill="#d3e5d2" stroke="#2ca02c" stroke-width="2"/>
<text x="512.0" y="374.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Mensagem do pastor Everton</text>
<text x="512.0" y="396.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >vídeo 1 h depois do fim do culto (ex.: termina 21h, chega 22h)</text>
<text x="512.0" y="417.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >convida para o Café ou direto para uma célula</text>
<path d="M512,444 L512,520" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,512 L512,520 L517,512 Z" fill="#bdbdb9"/>
<polygon points="512,519 677,565 512,611 347,565" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512" y="561" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Qual opção</text>
<text x="512" y="583" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >a pessoa escolheu?</text>
<path d="M347,565 L177,565 L177,665" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M172,657 L177,665 L182,657 Z" fill="#bdbdb9"/>
<path d="M677,565 L847,565 L847,665" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M842,657 L847,665 L852,657 Z" fill="#bdbdb9"/>
<path d="M512,611 L512,665" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,657 L512,665 L517,657 Z" fill="#bdbdb9"/>
<text x="32" y="557" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="start" >1 · Quero conhecer uma célula</text>
<text x="856" y="557" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="start" >3 · Não respondeu</text>
<text x="522" y="640" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="start" >2 · Quero conhecer mais (Café)</text>
<rect x="32" y="665" width="290" height="150" rx="12" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="177.0" y="714.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Direto à célula</text>
<text x="177.0" y="736.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >quer conhecer uma célula:</text>
<text x="177.0" y="757.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >pula o Café e o sistema segue</text>
<text x="177.0" y="778.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >sozinho, sem ninguém no meio</text>
<rect x="367" y="665" width="290" height="150" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512.0" y="703.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Direcionamento à Integração</text>
<text x="512.0" y="725.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >Matheus, líder da Integração,</text>
<text x="512.0" y="746.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >escolhe quem da equipe liga</text>
<text x="512.0" y="767.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >(ex.: Renan liga para o João)</text>
<text x="512.0" y="788.5" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >segunda: o responsável já sabe</text>
<rect x="702" y="665" width="290" height="150" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="847.0" y="714.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Quem não respondeu</text>
<text x="847.0" y="736.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >aba da Integração com os nomes</text>
<text x="847.0" y="757.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >de quem não respondeu à mensagem</text>
<text x="847.0" y="778.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >ou que o responsável não achou</text>
<rect x="367" y="865" width="290" height="110" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512.0" y="894.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Ligação do responsável</text>
<text x="512.0" y="916.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >liga, conhece a pessoa e</text>
<text x="512.0" y="937.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >convida para o Café</text>
<text x="512.0" y="958.0" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >prazo: até quarta</text>
<path d="M512,815 L512,865" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,857 L512,865 L517,857 Z" fill="#bdbdb9"/>
<rect x="702" y="865" width="290" height="110" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="847.0" y="894.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Contato humano</text>
<text x="847.0" y="916.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >Matheus escolhe os responsáveis;</text>
<text x="847.0" y="937.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >ligação ou mensagem pessoal,</text>
<text x="847.0" y="958.0" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >nada de automação</text>
<path d="M847,815 L847,865" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M842,857 L847,865 L852,857 Z" fill="#bdbdb9"/>
<rect x="342" y="1010" width="340" height="108" rx="12" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="512.0" y="1038.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Cobrança no WhatsApp</text>
<text x="512.0" y="1060.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >quarta: o sistema pergunta ao</text>
<text x="512.0" y="1081.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >responsável se conseguiu contato</text>
<text x="512.0" y="1102.0" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >1 consegui · 2 ainda não · 3 não respondeu</text>
<path d="M512,975 L512,1010" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1002 L512,1010 L517,1002 Z" fill="#bdbdb9"/>
<path d="M512,1118 L512,1190" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1182 L512,1190 L517,1182 Z" fill="#bdbdb9"/>
<path d="M847,975 L847,1154 L512,1154" stroke="#bdbdb9" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
<text x="690" y="1171" font-size="13.5" font-weight="400" fill="#666" text-anchor="middle" >aceitou o Café</text>
<rect x="342" y="1190" width="340" height="88" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512.0" y="1218.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Confirmação até sexta</text>
<text x="512.0" y="1240.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >o responsável entrega a lista</text>
<text x="512.0" y="1261.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >de quem vai ao Café</text>
<rect x="342" y="1312" width="340" height="88" rx="12" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="512.0" y="1340.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Lembrete automático</text>
<text x="512.0" y="1362.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >2 dias antes e no sábado:</text>
<text x="512.0" y="1383.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >o sistema lembra a pessoa</text>
<path d="M512,1278 L512,1312" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1304 L512,1312 L517,1304 Z" fill="#bdbdb9"/>
<rect x="342" y="1434" width="340" height="88" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512.0" y="1462.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Check-in na entrada</text>
<text x="512.0" y="1484.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >voluntário da Integração marca</text>
<text x="512.0" y="1505.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >quem chegou na lista de confirmados</text>
<path d="M512,1400 L512,1434" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1426 L512,1434 L517,1426 Z" fill="#bdbdb9"/>
<rect x="342" y="1556" width="340" height="124" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="512.0" y="1581.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Café de Conexão</text>
<text x="512.0" y="1603.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >3º domingo do mês, com os pastores:</text>
<text x="512.0" y="1624.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >apresentam a igreja</text>
<text x="512.0" y="1645.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >QR code no telão para quem não tem cadastro</text>
<text x="512.0" y="1666.5" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >depois, segue para a célula</text>
<path d="M512,1522 L512,1556" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1548 L512,1556 L517,1548 Z" fill="#bdbdb9"/>
<path d="M177,815 L177,1720 L512,1720" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M512,1680 L512,1720" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M512,1720 L512,1760" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1752 L512,1760 L517,1752 Z" fill="#bdbdb9"/>
<rect x="308" y="1760" width="403" height="124" rx="12" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="509.5" y="1785.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Mensagem com 5 células</text>
<text x="509.5" y="1807.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >5 sugestões pelo bairro do formulário, faixa etária</text>
<text x="509.5" y="1828.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >e Kids; se faltar célula no bairro, completa com</text>
<text x="509.5" y="1849.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >as mais próximas. A pessoa toca na escolhida</text>
<text x="509.5" y="1870.5" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >sem escolha em 2 dias: “Quem não respondeu”</text>
<rect x="308" y="1918" width="403" height="82" rx="12" fill="#e0f2dc" stroke="#2ca02c" stroke-width="2"/>
<text x="509.5" y="1943.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Aviso ao líder da célula</text>
<text x="509.5" y="1965.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >na hora da escolha: “Renan, a Mariana quer</text>
<text x="509.5" y="1986.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >conhecer sua célula, entre em contato”</text>
<path d="M512,1884 L512,1918" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,1910 L512,1918 L517,1910 Z" fill="#bdbdb9"/>
<rect x="308" y="2034" width="403" height="82" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="509.5" y="2059.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Convite do líder</text>
<text x="509.5" y="2081.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >o líder liga e convida</text>
<text x="509.5" y="2102.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >em até 2 dias</text>
<path d="M512,2000 L512,2034" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,2026 L512,2034 L517,2026 Z" fill="#bdbdb9"/>
<rect x="308" y="2156" width="403" height="104" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="2"/>
<text x="509.5" y="2182.0" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Cobrança do líder da célula</text>
<text x="509.5" y="2204.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >“você entrou em contato?” — o pastor vê</text>
<text x="509.5" y="2225.0" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >no painel quem foi contatado</text>
<text x="509.5" y="2246.0" font-size="14.5" font-weight="500" fill="#1a1a1a" text-anchor="middle" >hoje: Matheus · 2027: líderes de rede</text>
<path d="M512,2116 L512,2148" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,2140 L512,2148 L517,2140 Z" fill="#bdbdb9"/>
<rect x="308" y="2300" width="403" height="82" rx="12" fill="#e4eefa" stroke="#2f6fc9" stroke-width="3"/>
<text x="509.5" y="2325.5" font-size="17.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Pessoa na célula</text>
<text x="509.5" y="2347.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >a pessoa vai à reunião</text>
<text x="509.5" y="2368.5" font-size="14.5" font-weight="400" fill="#5d5d5d" text-anchor="middle" >e começa a se integrar</text>
<path d="M512,2268 L512,2300" stroke="#bdbdb9" stroke-width="2" fill="none"/>
<path d="M507,2292 L512,2300 L517,2292 Z" fill="#bdbdb9"/>
<rect x="730" y="1190" width="262" height="285" rx="12" fill="#f6f6f4" stroke="#bdbdb9" stroke-width="1.8"/>
<text x="861.0" y="1226" font-size="16.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" >Visibilidade para o pastor</text>
<text x="752" y="1258" font-size="14" font-weight="400" fill="#333" text-anchor="start" >O pastor cobra com números:</text>
<text x="752" y="1278" font-size="14" font-weight="400" fill="#333" text-anchor="start" ></text>
<text x="752" y="1298" font-size="14" font-weight="400" fill="#333" text-anchor="start" >• pessoa direcionada na segunda</text>
<text x="752" y="1318" font-size="14" font-weight="400" fill="#333" text-anchor="start" >• contato do responsável até</text>
<text x="752" y="1338" font-size="14" font-weight="400" fill="#333" text-anchor="start" >   quarta (consegui, ainda não,</text>
<text x="752" y="1358" font-size="14" font-weight="400" fill="#333" text-anchor="start" >   não respondeu)</text>
<text x="752" y="1378" font-size="14" font-weight="400" fill="#333" text-anchor="start" >• presença real no Café (check-in)</text>
<text x="752" y="1398" font-size="14" font-weight="400" fill="#333" text-anchor="start" >• líder da célula contatou em</text>
<text x="752" y="1418" font-size="14" font-weight="400" fill="#333" text-anchor="start" >   até 2 dias</text>
<text x="752" y="1438" font-size="14" font-weight="400" fill="#333" text-anchor="start" >• lista de quem não respondeu</text>
</svg>